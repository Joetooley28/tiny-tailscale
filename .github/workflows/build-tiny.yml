name: Build Tiny Tailscale

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v1.96.4). Leave empty for latest stable.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check for new upstream stable release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get latest stable RELEASE from upstream (even minor = stable)
          # Uses gh release list, not git tags — tags can exist without a release
          LATEST=$(gh release list --repo tailscale/tailscale --limit 100 \
            --json tagName --jq '.[].tagName' | \
            grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+$' | \
            awk -F. '$2 % 2 == 0' | \
            sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            echo "No stable version found"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest upstream stable: v${LATEST}"

          EXISTING=$(gh release view "v${LATEST}" \
            --repo "${{ github.repository }}" \
            --json tagName -q .tagName 2>/dev/null || echo "")

          if [ "v${LATEST}" = "${EXISTING}" ]; then
            echo "Already released v${LATEST}"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version: v${LATEST}"
            echo "version=v${LATEST}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            goos: linux
            goarch: arm
            goextra: ""
          - arch: arm64
            goos: linux
            goarch: arm64
            goextra: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream release and checkout
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          git remote add upstream https://github.com/tailscale/tailscale.git || true
          git fetch upstream tag "$VERSION" --no-tags --force
          git checkout "$VERSION"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate version info
        id: version
        run: |
          eval $(CGO_ENABLED=0 go run ./cmd/mkversion)
          echo "long=${VERSION_LONG}" >> "$GITHUB_OUTPUT"
          echo "short=${VERSION_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Generate build tags
        id: tags
        run: |
          TAGS=$(CGO_ENABLED=0 go run ./cmd/featuretags \
            --min \
            --add=cli,ssh,serve,taildrop,advertiseexitnode,useexitnode,advertiseroutes,useroutes,doctor,syspolicy,clientmetrics,cliconndiag,colorable,relayserver,osrouter,health,portmapper,iptables,listenrawdisco,cachenetmap,wakeonlan,gro,linkspeed,tundevstats,unixsocketidentity,ipnbus)
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Build tags: ${TAGS}"

      - name: Build combined binary
        run: |
          export CGO_ENABLED=0
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          if [ -n "${{ matrix.goextra }}" ]; then
            export ${{ matrix.goextra }}
          fi
          go build -o tailscaled -trimpath \
            -tags "${{ steps.tags.outputs.tags }}" \
            -ldflags "-s -w \
              -X tailscale.com/version.longStamp=${{ steps.version.outputs.long }} \
              -X tailscale.com/version.shortStamp=${{ steps.version.outputs.short }}" \
            ./cmd/tailscaled

      - name: Package
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          VERSION="${VERSION#v}"
          DIR="tiny-tailscale_${VERSION}_${{ matrix.arch }}"
          mkdir "$DIR"
          mv tailscaled "$DIR/"
          ln -s tailscaled "$DIR/tailscale"
          tar czf "${DIR}.tgz" "$DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-tailscale-${{ matrix.arch }}
          path: tiny-tailscale_*.tgz

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tiny-tailscale-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          VERSION_NUM="${VERSION#v}"
          cat > release-notes.md <<EOF
          ## tiny-tailscale ${VERSION_NUM}

          Stripped combined binary built from upstream [tailscale ${VERSION}](https://github.com/tailscale/tailscale/releases/tag/${VERSION}).

          **Ready to use:** the archive includes both the \`tailscaled\` daemon and the \`tailscale\` command. They share one underlying executable, but users do not need to rename files or set \`TS_BE_CLI\`.

          ### Choose one architecture download
          This release contains two separate archives. Download **one** file matching the device architecture:

          - \`tiny-tailscale_${VERSION_NUM}_arm.tgz\` — ARMv7 32-bit (\`armv7l\`, including RM520N/CFW-3212)
          - \`tiny-tailscale_${VERSION_NUM}_arm64.tgz\` — ARMv8-A 64-bit (\`aarch64\`, including RM551E-GL)

          These are separate architecture builds; users do not need both files. Check with \`uname -m\` if unsure.

          ### Difference from iamromulan/tiny-tailscale
          This fork fetches the same upstream Tailscale source. The functional change is that it adds the \`ipnbus\` feature, which is required for interactive \`tailscale up\` to return the browser authorization URL. The workflow is focused on publishing the ARMv7 and ARM64 builds used by these modem targets.

          ### Included (26 features incl. ipnbus + auto-resolved dependencies)
          cli, ssh, serve/funnel, taildrop, exit node (advertise + use), route advertising + use, doctor, syspolicy, clientmetrics, cliconndiag, colorable, relayserver, osrouter, health, portmapper, iptables, listenrawdisco, cachenetmap, wakeonlan, gro, linkspeed, tundevstats, unixsocketidentity, ipnbus

          ### Stripped
          Everything else — aws, kube, bird, webclient, debugeventbus, dns, capture, tap, tpm, cloud, completion, desktop_sessions, and more. Full list in [README](https://github.com/Joetooley28/tiny-tailscale#readme). Build tags generated automatically by \`cmd/featuretags --min\` with dependency resolution.

          ### Install
          Replace \`<ver>\` with the exact version from this release and \`<arch>\` with \`arm\` for ARMv7/\`armv7l\` devices such as RM520N/CFW-3212, or \`arm64\` for ARMv8-A/\`aarch64\` devices such as RM551E-GL. The version must match in the archive filename and extracted directory; for this release, use \`${VERSION_NUM}\` throughout. Download and install only the archive matching the device.
          \`\`\`sh
          tar xzf tiny-tailscale_${VERSION_NUM}_<arch>.tgz
          cp tiny-tailscale_${VERSION_NUM}_<arch>/tailscaled /usr/sbin/
          cp tiny-tailscale_${VERSION_NUM}_<arch>/tailscale /usr/bin/
          \`\`\`

          For a quick start and browser login flow:
          \`\`\`sh
          tailscaled >/tmp/tailscaled.log 2>&1 & sleep 1; tailscale up
          \`\`\`
          EOF

          if gh release view "${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" \
              --repo "${{ github.repository }}" \
              --title "tiny-tailscale ${VERSION_NUM}" \
              --notes-file release-notes.md
            gh release upload "${VERSION}" \
              --repo "${{ github.repository }}" \
              --clobber \
              artifacts/tiny-tailscale_*.tgz
          else
            gh release create "${VERSION}" \
              --repo "${{ github.repository }}" \
              --title "tiny-tailscale ${VERSION_NUM}" \
              --notes-file release-notes.md \
              artifacts/tiny-tailscale_*.tgz
          fi
